views.cache.views_time_cache:
  type: views_cache
  label: 'Time-based (presets & cron)'
  mapping:
    options:
      type: mapping
      label: 'Cache options'
      mapping:
        cache_mode:
          type: string
          label: 'Cache mode (preset or cron)'
        results_preset:
          type: integer
          label: 'Query-results preset interval in seconds (0 = forever)'
        output_preset:
          type: integer
          label: 'Rendered-output preset interval in seconds (0 = forever)'
        cron_expression:
          type: string
          label: 'Cron expression'
