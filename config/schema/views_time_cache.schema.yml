block.block.*.third_party.views_time_cache:
  type: mapping
  label: 'Views Time Cache block settings'
  mapping:
    max_age_mode:
      type: string
      label: 'Cache max-age mode (preset or cron; empty = no override)'
    max_age_preset:
      type: integer
      label: 'Preset interval in seconds (0 = forever, -2 = never / max-age 0)'
    cron_expression:
      type: string
      label: 'Cron expression'

views.cache.views_time_cache:
  type: views_cache
  label: 'Time-based (presets & cron)'
  mapping:
    options:
      type: mapping
      label: 'Cache options'
      mapping:
        cache_mode:
          type: string
          label: 'Cache mode (preset or cron)'
        results_preset:
          type: integer
          label: 'Query-results preset interval in seconds (0 = forever, -2 = never)'
        output_preset:
          type: integer
          label: 'Rendered-output preset interval in seconds (0 = forever, -2 = never)'
        cron_expression:
          type: string
          label: 'Cron expression'
